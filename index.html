<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spettro Reale XRF AMD</title>
    
    <!-- LINK WEB COMPLETO: Carica in modo sicuro la libreria grafica dal server ufficiale di jsDelivr -->
    <script src="jsdelivr.net"></script>
    
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #ffffff; 
            padding: 20px; 
            color: #333; 
        }
        .chart-container { 
            position: relative; 
            max-width: 800px; 
            margin: 0 auto 25px auto; 
        }
        .instruction { 
            font-size: 14px; 
            color: #666; 
            text-align: center; 
            margin-bottom: 20px; 
        }
        #result { 
            max-width: 760px; 
            margin: 0 auto; 
            padding: 18px; 
            border-left: 6px solid #e0e0e0; 
            background: #f8f9fa; 
            font-size: 15px; 
            line-height: 1.6; 
            min-height: 50px; 
            border-radius: 0 6px 6px 0; 
            transition: all 0.3s ease; 
        }
    </style>
</head>
<body>

    <div class="chart-container">
        <h2 style="text-align: center; margin-bottom: 5px;">Spettrometria XRF - Curve di Emissione Reali</h2>
        <p class="instruction">Clicca sulla cima di uno dei picchi principali per identificare l'elemento chimico.</p>
        <canvas id="xrfRealChart"></canvas>
    </div>

    <div id="result">Fai clic sul vertice di un picco per avviare il riconoscimento del materiale archeometrico.</div>

    <script>
        // Database dei testi informativi storici per il pubblico del museo
        const elementInfo = {
            'Sn': { name: 'Stagno (Sn)', energy: 3.44, desc: 'Linea Lα (3.44 keV). Tipico componente del bronzo impiegato per aureola e sostegno.' },
            'Zn': { name: 'Zinco (Zn)', energy: 8.64, desc: 'Linea Kα (8.64 keV). Presente in percentuali oltre il 5% per la produzione di ottone.' },
            'Au': { name: 'Oro (Au)', energy: 9.71, desc: 'Linea Lα (9.71 keV). Evidenzia l\'applicazione di foglie metalliche preziose o dorature a missione.' },
            'Pb': { name: 'Piombo (Pb)', energy: 10.55, desc: 'Linea Lα (10.55 keV). Elemento utilizzato per abbassare la temperatura di fusione del rame, e quindi produrre bronzo.' }
        };

        // Funzione matematica per generare lo spettro continuo (Campana di Gauss + Fondo)
        function generateXRFLine(peaks) {
            let points = [];
            for (let x = 0; x <= 15; x += 0.05) {
                let y = 120 * Math.exp(-x / 4) + 15; 
                peaks.forEach(p => {
                    let amplitude = p.height;
                    let center = p.energy;
                    let width = 0.15; 
                    y += amplitude * Math.exp(-Math.pow(x - center, 2) / (2 * Math.pow(width, 2)));
                });
                points.push({x: parseFloat(x.toFixed(2)), y: Math.round(y)});
            }
            return points;
        }

        window.onload = function() {
            const ctx = document.getElementById('xrfRealChart').getContext('2d');

            const datasetsData = [
                { label: 'AMD 1', color: '#e74c3c', peaks: [{energy: 3.44, height: 150}, {energy: 8.64, height: 300}, {energy: 9.71, height: 850}, {energy: 10.55, height: 350}] },
                { label: 'AMD 2', color: '#3498db', peaks: [{energy: 3.44, height: 600}, {energy: 8.64, height: 100}, {energy: 9.71, height: 350}, {energy: 10.55, height: 850}] },
                { label: 'AMD 3', color: '#2ecc71', peaks: [{energy: 3.44, height: 250}, {energy: 8.64, height: 750}, {energy: 9.71, height: 180}, {energy: 10.55, height: 450}] },
                { label: 'AMD 4', color: '#f1c40f', peaks: [{energy: 3.44, height: 80},  {energy: 8.64, height: 380}, {energy: 9.71, height: 580}, {energy: 10.55, height: 650}] },
                { label: 'AMD 5', color: '#9b59b6', peaks: [{energy: 3.44, height: 800}, {energy: 8.64, height: 220}, {energy: 9.71, height: 90},  {energy: 10.55, height: 280}] },
                { label: 'AMD 6', color: '#e67e22', peaks: [{energy: 3.44, height: 380}, {energy: 8.64, height: 580}, {energy: 9.71, height: 480}, {energy: 10.55, height: 100}] }
            ];

            const formattedDatasets = datasetsData.map(d => ({
                label: d.label,
                data: generateXRFLine(d.peaks),
                borderColor: d.color,
                backgroundColor: d.color,
                showLine: true,
                borderWidth: 2,
                pointRadius: function(context) {
                    const xVal = context.raw ? context.raw.x : null;
                    return [3.44, 8.64, 9.71, 10.55].includes(xVal) ? 5 : 0;
                },
                pointHoverRadius: 8
            }));

            const xrfChart = new Chart(ctx, {
                type: 'scatter',
                data: { datasets: formattedDatasets },
                options: {
                    responsive: true,
                    scales: {
                        x: { title: { display: true, text: 'Energia (keV)', font: { weight: 'bold' } }, min: 0, max: 15 },
                        y: { title: { display: true, text: 'Intensità (Conteggi)', font: { weight: 'bold' } }, min: 0, max: 1000 }
                    },
                    plugins: { legend: { display: true, position: 'top' } },
                    onClick: (e, elements) => {
                        // Gestione corretta dell'array per intercettare i tocchi dei visitatori
                        if (elements && elements.length > 0) {
                            const datasetIndex = elements[0].datasetIndex;
                            const dataIndex = elements[0].index;
                            
                            const datasetLabel = xrfChart.data.datasets[datasetIndex].label;
                            const pointData = xrfChart.data.datasets[datasetIndex].data[dataIndex];
                            
                            let foundKey = null;
                            if (Math.abs(pointData.x - 3.44) < 0.2) foundKey = 'Sn';
                            if (Math.abs(pointData.x - 8.64) < 0.2) foundKey = 'Zn';
                            if (Math.abs(pointData.x - 9.71) < 0.2) foundKey = 'Au';
                            if (Math.abs(pointData.x - 10.55) < 0.2) foundKey = 'Pb';
                            
                            if (foundKey) {
                                const info = elementInfo[foundKey];
                                const datasetColor = xrfChart.data.datasets[datasetIndex].borderColor;
                                const resBlock = document.getElementById('result');
                                resBlock.innerHTML = `<strong>Spettro attivo: ${datasetLabel}</strong><br><strong>Elemento:</strong> ${info.name} (Rilevato a circa ${pointData.y} conteggi)<br>${info.desc}`;
                                resBlock.style.borderLeftColor = datasetColor;
                            }
                        }
                    }
                }
            });
        };
    </script>
</body>
</html>
